<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>
<style>
  /* ===== Design: dark, calm, one accent colour ===== */
  :root {
    --bg: #1a1d21;        /* page background */
    --card: #202429;      /* card background */
    --border: #2d333a;    /* subtle card borders */
    --accent: #5eead4;    /* the one accent colour (teal) */
    --text: #e8edf2;      /* main text */
    --muted: #9aa4af;     /* secondary text */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 1rem 0.75rem;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;   /* to-dos and links sit side by side */
    gap: 1rem;
    max-width: 1000px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }

  header.card {
    grid-column: 1 / -1;              /* clock stretches across both columns */
    text-align: center;
    padding: 1.5rem 1rem;
  }

  /* ===== Clock and date ===== */
  #clock {
    display: block;
    font-size: clamp(2.25rem, 8vw, 3.25rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums; /* keeps the digits from jittering */
    letter-spacing: 0.02em;
  }

  #date {
    margin-top: 0.5rem;
    font-size: 1.25rem;
    color: var(--muted);
  }

  /* ===== Weather ===== */
  .weather-card {
    grid-column: 1 / -1;
    text-align: center;
    padding: 1rem;
  }

  #weather-location {
    font-size: 0.9rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }

  #weather-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  #weather-icon {
    font-size: 2rem;
    line-height: 1;
  }

  #weather-temp {
    font-size: 2.25rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  #weather-desc {
    margin-top: 0.25rem;
    font-size: 1rem;
    color: var(--muted);
  }

  .city-form {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1rem;
  }

  .city-form input {
    flex: 1;
    max-width: 260px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    color: var(--text);
  }

  .city-form input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .city-form button {
    padding: 0.6rem 1.1rem;
    font-size: 1rem;
  }

  .city-toggle {
    margin-top: 0.75rem;
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0.25rem 0.5rem;
  }

  .city-toggle:hover {
    color: var(--accent);
    filter: none;
  }

  .city-pick {
    display: block;
    margin: 0.75rem auto 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.9rem;
    font-size: 1rem;
    color: var(--text);
    max-width: 320px;
    width: 100%;
  }

  .city-pick:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* ===== Section titles ===== */
  h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .notes-card {
    grid-column: 1 / -1;              /* notes stretch across both columns */
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ===== To-do list ===== */
  #todo-form {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  #todo-input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    font-size: 1rem;
    color: var(--text);
  }

  #todo-input:focus,
  #notes:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 10px;
    padding: 0.65rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    filter: brightness(1.08);
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  button:disabled:hover {
    filter: none;
  }

  #todo-list {
    list-style: none;
  }

  #todo-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
  }

  #todo-list li:last-child {
    border-bottom: none;
  }

  #todo-list label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    cursor: pointer;
    min-width: 0;
  }

  #todo-list label span {
    overflow-wrap: anywhere;
  }

  input[type="checkbox"] {
    width: 1.25rem;
    height: 1.25rem;
    accent-color: var(--accent);      /* paints the checkbox in the accent colour */
    cursor: pointer;
    flex-shrink: 0;
  }

  li.done label span {
    text-decoration: line-through;    /* checked items get struck through */
    color: var(--muted);
  }

  button.delete {
    background: transparent;
    color: var(--muted);
    padding: 0.25rem 0.5rem;
    font-size: 1.4rem;
    line-height: 1;
  }

  button.delete:hover {
    color: #ff8c8c;
    filter: none;
  }

  .empty {
    color: var(--muted);
    font-style: italic;
  }

  /* ===== Links ===== */
  #links-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  #links-list a {
    display: block;
    padding: 0.65rem 0.85rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    text-align: center;
    font-size: 1rem;
    transition: border-color 0.15s, color 0.15s;
  }

  #links-list a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ===== Notes ===== */
  #notes {
    width: 100%;
    min-height: 130px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 0.85rem;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text);
    resize: vertical;                 /* lets you drag the box taller */
  }

  /* ===== Music ===== */
  .music-card {
    grid-column: 1 / -1;
  }

  .music-form {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .music-form input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    font-size: 1rem;
    color: var(--text);
  }

  .music-form input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .music-form button {
    padding: 0.65rem 1rem;
    font-size: 1rem;
  }

  .player-frame {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;   /* 16:9 */
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
  }

  #player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100% !important;
    height: 100% !important;
    border: 0;
  }

  .music-controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin: 0.75rem 0;
  }

  .music-controls button {
    padding: 0.5rem 1rem;
    font-size: 1rem;
  }

  .music-list {
    list-style: none;
  }

  .music-list li {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
  }

  .music-list li:last-child {
    border-bottom: none;
  }

  .music-list li.current {
    background: rgba(94, 234, 212, 0.08);
    border-radius: 8px;
  }

  .music-list img {
    border-radius: 6px;
    flex-shrink: 0;
    width: 120px;
    height: 90px;
    object-fit: cover;
  }

  .music-title {
    flex: 1;
    min-width: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .music-play {
    padding: 0.4rem 0.8rem;
    font-size: 0.9rem;
  }

  /* ===== Home bar (top of the dashboard): weather + music at a glance ===== */
  .home-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 1rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .home-weather {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  #home-w-temp {
    color: var(--accent);
    font-weight: 600;
  }

  #home-w-loc {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .home-music {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
  }

  .music-now {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .music-bar-controls {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .music-bar-controls button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.3rem 0.6rem;
    font-size: 0.9rem;
    line-height: 1;
    min-width: 2.4rem;
  }

  .music-bar-controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
    filter: none;
  }

  /* ===== Narrow screens: single column + smaller components ===== */
  @media (max-width: 700px) {
    body {
      padding: 1.25rem 0.75rem;
    }
    main {
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .card {
      padding: 1.1rem;
    }
    header.card {
      padding: 1.5rem 1rem;
    }
    .weather-card {
      padding: 1rem;
    }
    #clock {
      font-size: 2.75rem;
    }
    #date {
      font-size: 1.15rem;
    }
    #weather-temp {
      font-size: 2.5rem;
    }
    #weather-icon {
      font-size: 2rem;
    }
    .home-bar {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
  }

  /* ===== Phones: extra-small tuning ===== */
  @media (max-width: 480px) {
    body {
      padding: 1rem 0.5rem;
    }
    .card {
      padding: 0.9rem;
      border-radius: 12px;
    }
    header.card {
      padding: 1.25rem 0.75rem;
    }
    #clock {
      font-size: 2.25rem;
    }
    #date {
      font-size: 1rem;
    }
    #weather-temp {
      font-size: 2rem;
    }
    #weather-icon {
      font-size: 1.75rem;
    }
    #weather-location {
      font-size: 0.85rem;
    }
    #weather-desc {
      font-size: 1rem;
    }
    #todo-input,
    #notes,
    .music-form input {
      font-size: 1rem;
    }
    #todo-list label {
      font-size: 1rem;
    }
    #links-list {
      grid-template-columns: 1fr;
    }
    .music-list img {
      width: 96px;
      height: 72px;
    }
    .music-title {
      font-size: 0.8rem;
    }
  }
</style>
</head>
<body>
  <main>
    <!-- HOME BAR — weather + music at a glance -->
    <section class="home-bar" aria-label="At a glance">
      <div class="home-weather" id="home-weather">
        <span id="home-w-icon" aria-hidden="true">🌡️</span>
        <span id="home-w-temp">–°</span>
        <span id="home-w-loc">Locating…</span>
      </div>
      <div class="home-music" id="home-music" hidden>
        <span class="music-now" id="music-now">♪ —</span>
        <div class="music-bar-controls">
          <button id="bar-prev" type="button" aria-label="Previous">⏮</button>
          <button id="bar-play" type="button" aria-label="Play">▶</button>
          <button id="bar-next" type="button" aria-label="Next">⏭</button>
        </div>
      </div>
    </section>

    <!-- 1. CLOCK -->
    <header class="card">
      <time id="clock">--:--:--</time>
      <p id="date"></p>
    </header>

    <!-- WEATHER -->
    <section class="card weather-card">
      <h2 class="visually-hidden">Weather</h2>
      <p id="weather-location">Locating…</p>
      <p id="weather-main">
        <span id="weather-icon" aria-hidden="true"></span>
        <span id="weather-temp">–°F</span>
      </p>
      <p id="weather-desc">Checking the sky…</p>
      <form id="city-form" class="city-form" hidden>
        <label for="city-input" class="visually-hidden">City</label>
        <input id="city-input" type="text" placeholder="City, ZIP, or lat, lon" autocomplete="off">
        <button type="submit">Set</button>
      </form>
      <select id="city-pick" class="city-pick" hidden>
        <option value="">Choose your city…</option>
      </select>
      <button id="city-toggle" type="button" class="city-toggle">Set city</button>
    </section>

    <!-- 2. TO-DOS -->
    <section class="card" aria-labelledby="todos-title">
      <h2 id="todos-title">To-dos</h2>
      <form id="todo-form">
        <label for="todo-input" class="visually-hidden">New to-do</label>
        <input id="todo-input" type="text" placeholder="Add a to-do…" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </section>

    <!-- 3. LINKS -->
    <section class="card" aria-labelledby="links-title">
      <h2 id="links-title">Links</h2>
      <ul id="links-list"></ul>
    </section>

    <!-- 4. NOTES -->
    <section class="card notes-card" aria-labelledby="notes-title">
      <h2 id="notes-title">Notes</h2>
      <label for="notes" class="visually-hidden">Notes</label>
      <textarea id="notes" placeholder="Type anything…"></textarea>
    </section>

    <!-- 5. MUSIC -->
    <section class="card music-card" aria-labelledby="music-title">
      <h2 id="music-title">Music</h2>
      <form id="music-form" class="music-form">
        <label for="music-input" class="visually-hidden">Add a YouTube link</label>
        <input id="music-input" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Paste a YouTube link…" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div class="player-frame">
        <div id="player"></div>
      </div>
      <div class="music-controls">
        <button id="music-prev" type="button">‹ Prev</button>
        <button id="music-next" type="button">Next ›</button>
      </div>
      <ul id="music-list" class="music-list"></ul>
    </section>
  </main>

<script>
/* ============================================================
   LINKS — edit your six bookmarks here, then save & refresh.
   Each bookmark is { name: "Text you see", url: "https://..." }
   ============================================================ */
const BOOKMARKS = [
  { name: "GitHub",      url: "https://github.com" },
  { name: "Gmail",       url: "https://mail.google.com" },
  { name: "YouTube",     url: "https://youtube.com" },
  { name: "Wikipedia",   url: "https://wikipedia.org" },
  { name: "Google Maps", url: "https://maps.google.com" },
  { name: "Translate",   url: "https://translate.google.com" }
];

/* ============ 1. CLOCK — update every second ============ */
const clockEl = document.getElementById("clock");
const dateEl = document.getElementById("date");

function updateClock() {
  const now = new Date();                          // the current moment
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  clockEl.textContent = hh + ":" + mm + ":" + ss;
  dateEl.textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

updateClock();                                     // show immediately
setInterval(updateClock, 1000);                    // ...then again every 1000 ms

/* ============ 2. TO-DOS — add, check, delete, save ============ */
const TODO_KEY = "dashboard.todos";                // the localStorage key
let todos = JSON.parse(localStorage.getItem(TODO_KEY)) || [];

const todoForm = document.getElementById("todo-form");
const todoInput = document.getElementById("todo-input");
const todoListEl = document.getElementById("todo-list");
renderTodos();                                     // paint saved to-dos on load

function saveTodos() {
  localStorage.setItem(TODO_KEY, JSON.stringify(todos));
}

function renderTodos() {
  todoListEl.innerHTML = "";                       // clear the list...
  if (todos.length === 0) {                        // ...then repaint it
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "No to-dos yet — add one above.";
    todoListEl.appendChild(empty);
    return;
  }
  for (const todo of todos) {
    const li = document.createElement("li");
    if (todo.done) li.className = "done";

    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.dataset.id = todo.id;
    checkbox.checked = todo.done;
    const span = document.createElement("span");
    span.textContent = todo.text;
    label.append(checkbox, span);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "delete";
    del.dataset.id = todo.id;
    del.textContent = "×";
    del.setAttribute("aria-label", "Delete to-do");

    li.append(label, del);
    todoListEl.appendChild(li);
  }
}

todoForm.addEventListener("submit", (event) => {
  event.preventDefault();                          // don't reload the page
  const text = todoInput.value.trim();
  if (!text) return;
  todos.push({ id: Date.now(), text, done: false });
  saveTodos();
  renderTodos();
  todoInput.value = "";
  todoInput.focus();
});

todoListEl.addEventListener("change", (event) => { // a checkbox was clicked
  if (!event.target.matches('input[type="checkbox"]')) return;
  const todo = todos.find(t => t.id === Number(event.target.dataset.id));
  if (todo) {
    todo.done = event.target.checked;
    saveTodos();
    renderTodos();
  }
});

todoListEl.addEventListener("click", (event) => {  // a delete button was clicked
  const del = event.target.closest("button.delete");
  if (!del) return;
  todos = todos.filter(t => t.id !== Number(del.dataset.id));
  saveTodos();
  renderTodos();
});

/* ============ 3. LINKS — paint the six bookmarks ============ */
const linksListEl = document.getElementById("links-list");

for (const bookmark of BOOKMARKS) {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = bookmark.url;
  a.target = "_blank";                             // open in a new tab
  a.rel = "noopener";                              // new tab can't tamper with this page
  a.textContent = bookmark.name;
  li.appendChild(a);
  linksListEl.appendChild(li);
}

/* ============ 4. NOTES — save every keystroke ============ */
const NOTES_KEY = "dashboard.notes";               // the localStorage key
const notesEl = document.getElementById("notes");

notesEl.value = localStorage.getItem(NOTES_KEY) || "";
notesEl.addEventListener("input", () => {
  localStorage.setItem(NOTES_KEY, notesEl.value);
});

/* ============ 5. WEATHER — location + free Open-Meteo API ============ */
const weatherLocationEl = document.getElementById("weather-location");
const weatherIconEl = document.getElementById("weather-icon");
const weatherTempEl = document.getElementById("weather-temp");
const weatherDescEl = document.getElementById("weather-desc");
const homeWIcon = document.getElementById("home-w-icon");
const homeWTemp = document.getElementById("home-w-temp");
const homeWLoc = document.getElementById("home-w-loc");

/* WMO weather codes -> readable condition + emoji */
const WEATHER_DESCRIPTIONS = {
  0:  ["Clear sky",         "☀️"],
  1:  ["Mainly clear",      "🌤️"],
  2:  ["Partly cloudy",     "⛅"],
  3:  ["Overcast",          "☁️"],
  45: ["Fog",               "🌫️"],
  48: ["Freezing fog",      "🌫️"],
  51: ["Light drizzle",     "🌦️"],
  53: ["Drizzle",           "🌦️"],
  55: ["Dense drizzle",     "🌦️"],
  61: ["Light rain",        "🌧️"],
  63: ["Rain",              "🌧️"],
  65: ["Heavy rain",        "🌧️"],
  71: ["Light snow",        "🌨️"],
  73: ["Snow",              "🌨️"],
  75: ["Heavy snow",        "🌨️"],
  77: ["Snow grains",       "🌨️"],
  80: ["Light showers",     "🌧️"],
  81: ["Showers",           "🌧️"],
  82: ["Heavy showers",     "🌧️"],
  85: ["Snow showers",      "🌨️"],
  86: ["Heavy snow showers","🌨️"],
  95: ["Thunderstorm",      "⛈️"],
  96: ["Storm with hail",   "⛈️"],
  99: ["Hail storm",        "⛈️"]
};

/* Turn a WMO code into [description, emoji]; nights with clear
   sky get a moon instead of a sun. */
function describeWeather(code, isDay) {
  const entry = WEATHER_DESCRIPTIONS[code] || ["Unknown", "🌡️"];
  const label = entry[0];
  const emoji = entry[1];
  if (!isDay && (code === 0 || code === 1)) return [label, "🌙"];
  return [label, emoji];
}

async function fetchWeather(lat, lon) {
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + lat
    + "&longitude=" + lon
    + "&current_weather=true"
    + "&temperature_unit=fahrenheit";
  const response = await fetch(url);
  if (!response.ok) throw new Error("weather request failed");
  const data = await response.json();
  return data.current_weather;                     // { temperature, weathercode, is_day, ... }
}

function weatherUnavailable(details) {
  weatherLocationEl.textContent = "Weather unavailable";
  weatherIconEl.textContent = "🌡️";
  weatherTempEl.textContent = "–°F";
  weatherDescEl.textContent = details;
  updateHomeWeather("🌡️", "–°", "Weather unavailable");
}

/* Mirror the weather card into the top home bar. */
function updateHomeWeather(icon, temp, loc) {
  homeWIcon.textContent = icon;
  homeWTemp.textContent = temp;
  homeWLoc.textContent = loc;
}

async function showWeather(lat, lon, placeName) {
  try {
    const current = await fetchWeather(lat, lon);
    const [desc, emoji] = describeWeather(current.weathercode, current.is_day);
    weatherLocationEl.textContent = placeName;
    weatherIconEl.textContent = emoji;
    weatherTempEl.textContent = Math.round(current.temperature) + "°F";
    weatherDescEl.textContent = desc;
    updateHomeWeather(emoji, Math.round(current.temperature) + "°", placeName);
  } catch {
    weatherUnavailable("Couldn't reach the weather service. Try again in a moment.");
  }
}

function onLocationFound(position) {
  showWeather(
    position.coords.latitude,
    position.coords.longitude,
    "Current location"
  );
}

function onLocationFailed(error) {
  if (error && error.code === 1) {
    weatherUnavailable("Location is blocked. Click the icon in the address bar to allow it, or set a city, ZIP, or coordinates below.");
  } else if (error && error.code === 2) {
    weatherUnavailable("Couldn't get a GPS fix. Check Windows location settings, or set a city, ZIP, or coordinates below.");
  } else {
    weatherUnavailable("Location is off or timed out. Check Windows location settings, or set a city, ZIP, or coordinates below.");
  }
  cityFormEl.hidden = false;
  cityToggleEl.hidden = true;
}

/* ============ 6. MANUAL CITY — fallback when geolocation is unavailable ============ */
const CITY_KEY = "dashboard.city";
const cityFormEl = document.getElementById("city-form");
const cityInputEl = document.getElementById("city-input");
const cityToggleEl = document.getElementById("city-toggle");
const cityPickEl = document.getElementById("city-pick");
let cityResults = [];

function onCitySet(placeName) {
  cityFormEl.hidden = true;
  cityToggleEl.hidden = false;
  cityToggleEl.textContent = "Change city";
}

/* One friendly label per place, e.g. "Springfield, Illinois, United States" */
function placeLabel(place) {
  let label = place.name;
  if (place.admin1) label += ", " + place.admin1;
  if (place.country && place.country !== place.admin1) label += ", " + place.country;
  return label;
}

/* Show and remember the weather for one specific place. */
async function applyCity(place) {
  const placeName = placeLabel(place);
  await showWeather(place.latitude, place.longitude, placeName);
  localStorage.setItem(CITY_KEY, JSON.stringify({
    name: placeName,
    lat: place.latitude,
    lon: place.longitude
  }));
  onCitySet(placeName);
  cityPickEl.hidden = true;
}

/* Use raw coordinates directly — no geocoding needed. */
async function applyCoords(lat, lon) {
  await showWeather(lat, lon, "Coordinates");
  localStorage.setItem(CITY_KEY, JSON.stringify({ name: "Coordinates", lat, lon }));
  onCitySet("Coordinates");
  cityPickEl.hidden = true;
}

/* Search for a city. If the name matches several places, show a picker. */
async function fetchCityWeather(query) {
  const geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name="
    + encodeURIComponent(query) + "&count=5&language=en&format=json";
  const geoResponse = await fetch(geoUrl);
  if (!geoResponse.ok) throw new Error("geocoding request failed");
  const geoData = await geoResponse.json();
  if (!geoData.results || !geoData.results.length) throw new Error("city not found");
  cityResults = geoData.results;

  if (cityResults.length === 1) {
    await applyCity(cityResults[0]);
    return;
  }

  cityPickEl.innerHTML = '<option value="">Choose your city…</option>';
  cityResults.forEach((place, index) => {
    const opt = document.createElement("option");
    opt.value = String(index);
    opt.textContent = placeLabel(place);
    cityPickEl.appendChild(opt);
  });
  cityPickEl.hidden = false;
  weatherLocationEl.textContent = "Which " + query + "?";
  weatherDescEl.textContent = "Several places match — pick yours.";
}

cityPickEl.addEventListener("change", () => {
  const place = cityResults[Number(cityPickEl.value)];
  if (place) {
    applyCity(place).catch(() => weatherUnavailable("Couldn't load that place. Try again."));
  }
});

cityFormEl.addEventListener("submit", async (event) => {
  event.preventDefault();
  const query = cityInputEl.value.trim();
  if (!query) return;
  cityInputEl.disabled = true;
  weatherLocationEl.textContent = "Looking up " + query + "…";

  /* Smart search: "lat, lon" coordinates are used directly; anything else
     (a city name or a ZIP code) goes through the geocoder, with a picker
     when the match is ambiguous. */
  const coords = query.match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if (coords) {
    const lat = parseFloat(coords[1]);
    const lon = parseFloat(coords[2]);
    if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
      try {
        await applyCoords(lat, lon);
      } catch {
        weatherUnavailable("Couldn't load those coordinates. Try a city or ZIP instead.");
      } finally {
        cityInputEl.disabled = false;
        cityInputEl.focus();
      }
      return;
    }
  }

  try {
    await fetchCityWeather(query);
  } catch {
    weatherUnavailable("Couldn't find that place. Try a city, a ZIP code, or 'lat, lon'.");
  } finally {
    cityInputEl.disabled = false;
    cityInputEl.focus();
  }
});

cityToggleEl.addEventListener("click", () => {
  cityFormEl.hidden = false;
  cityToggleEl.hidden = true;
  cityInputEl.focus();
});

const savedCityRaw = localStorage.getItem(CITY_KEY);
if (savedCityRaw) {
  let savedInfo = null;
  try { savedInfo = JSON.parse(savedCityRaw); } catch { savedInfo = null; }
  if (savedInfo && typeof savedInfo === "object" && savedInfo.lat !== undefined && savedInfo.lon !== undefined) {
    showWeather(savedInfo.lat, savedInfo.lon, savedInfo.name || "Your city")
      .catch(() => weatherUnavailable("Couldn't load the saved city. Re-enter it below."));
    onCitySet(savedInfo.name || "Your city");
  } else {
    fetchCityWeather(savedCityRaw).catch(() => weatherUnavailable("Couldn't load the saved city. Re-enter it below."));
  }
} else if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(onLocationFound, onLocationFailed, { timeout: 8000 });
} else {
  onLocationFailed();
}

/* ============ 7. MUSIC — a YouTube queue you build ============ */
const MUSIC_KEY = "dashboard.music";
let musicQueue = JSON.parse(localStorage.getItem(MUSIC_KEY)) || [];
let musicIndex = -1;
let player = null;
let playerReady = false;

const musicForm = document.getElementById("music-form");
const musicInput = document.getElementById("music-input");
const musicListEl = document.getElementById("music-list");
const musicPrevBtn = document.getElementById("music-prev");
const musicNextBtn = document.getElementById("music-next");
const homeMusicEl = document.getElementById("home-music");
const musicNowEl = document.getElementById("music-now");
const barPrevBtn = document.getElementById("bar-prev");
const barPlayBtn = document.getElementById("bar-play");
const barNextBtn = document.getElementById("bar-next");

function saveMusic() {
  localStorage.setItem(MUSIC_KEY, JSON.stringify(musicQueue));
}

/* Parse a YouTube URL or raw ID into an 11-character video ID. */
function parseVideoId(text) {
  text = text.trim();
  const m = text.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/|live\/)|youtu\.be\/|music\.youtube\.com\/watch\?(?:.*&)?v=)([\w-]{11})/);
  if (m) return m[1];
  if (/^[\w-]{11}$/.test(text)) return text;
  return "";
}

function renderMusic() {
  musicListEl.innerHTML = "";
  if (musicQueue.length === 0) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "Paste a YouTube link to start your queue.";
    musicListEl.appendChild(empty);
    musicPrevBtn.disabled = musicNextBtn.disabled = true;
    updateMusicBar();
    return;
  }
  musicQueue.forEach((id, i) => {
    const li = document.createElement("li");
    if (i === musicIndex) li.className = "current";

    const thumb = document.createElement("img");
    thumb.src = "https://i.ytimg.com/vi/" + id + "/default.jpg";
    thumb.alt = "";
    thumb.loading = "lazy";
    thumb.width = 120;
    thumb.height = 90;

    const label = document.createElement("span");
    label.className = "music-title";
    label.textContent = id;

    const playBtn = document.createElement("button");
    playBtn.type = "button";
    playBtn.textContent = "Play";
    playBtn.className = "music-play";
    playBtn.addEventListener("click", () => playMusicAt(i));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "delete";
    del.textContent = "×";
    del.setAttribute("aria-label", "Remove from queue");
    del.addEventListener("click", () => {
      musicQueue.splice(i, 1);
      if (i === musicIndex) musicIndex = -1;
      else if (i < musicIndex) musicIndex -= 1;
      saveMusic();
      renderMusic();
    });

    li.append(thumb, label, playBtn, del);
    musicPrevBtn.disabled = musicNextBtn.disabled = false;
    musicListEl.appendChild(li);
  });
  updateMusicBar();
}

/* Keep the top control bar in sync with the queue and player state. */
function updateMusicBar() {
  if (musicQueue.length === 0) {
    homeMusicEl.hidden = true;
    return;
  }
  homeMusicEl.hidden = false;
  musicNowEl.textContent = "♪ " + (musicIndex >= 0 ? musicQueue[musicIndex] : "—");
}

function setPlayPauseButton(playing) {
  barPlayBtn.textContent = playing ? "❚❚" : "▶";
  barPlayBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
}

function playMusicAt(i) {
  if (i < 0 || i >= musicQueue.length) return;
  musicIndex = i;
  renderMusic();
  if (playerReady && player) {
    player.loadVideoById(musicQueue[i]);
  }
}

function nextMusic() {
  /* Auto-advance: stop at the end of the queue (no infinite autoplay). */
  if (musicIndex + 1 < musicQueue.length) playMusicAt(musicIndex + 1);
}

function nextMusicButton() {
  /* The Next button: advance, or wrap to the first track at the end. */
  if (musicIndex + 1 < musicQueue.length) {
    playMusicAt(musicIndex + 1);
  } else if (musicQueue.length > 0) {
    playMusicAt(0);
  }
}

function prevMusic() {
  /* The Prev button: go back, or restart the current song at the start. */
  if (musicIndex > 0) {
    playMusicAt(musicIndex - 1);
  } else if (musicIndex === 0 && playerReady && player) {
    player.seekTo(0, true);
    player.playVideo();
  }
}

musicForm.addEventListener("submit", (event) => {
  event.preventDefault();
  const id = parseVideoId(musicInput.value);
  if (!id) {
    musicInput.focus();
    return;
  }
  musicQueue.push(id);
  saveMusic();
  renderMusic();
  musicInput.value = "";
  musicInput.focus();
  if (musicIndex === -1) playMusicAt(0);   // auto-play the first link you add
});

/* Make paste reliable on iOS — insert the clipboard text at the cursor. */
musicInput.addEventListener("paste", (event) => {
  const data = (event.clipboardData || window.clipboardData).getData("text");
  if (!data) return;
  event.preventDefault();
  const start = musicInput.selectionStart;
  const end = musicInput.selectionEnd;
  musicInput.value = musicInput.value.slice(0, start) + data + musicInput.value.slice(end);
  const pos = start + data.length;
  musicInput.setSelectionRange(pos, pos);
});

musicPrevBtn.addEventListener("click", prevMusic);
musicNextBtn.addEventListener("click", nextMusicButton);

barPrevBtn.addEventListener("click", prevMusic);
barNextBtn.addEventListener("click", nextMusicButton);
barPlayBtn.addEventListener("click", () => {
  if (!playerReady || !player) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    player.playVideo();
  }
});

renderMusic();

/* YouTube's IFrame API calls this global when its script has loaded. */
function onYouTubeIframeAPIReady() {
  const config = {
    playerVars: { rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        playerReady = true;
        setPlayPauseButton(false);
        if (musicQueue.length > 0) {
          musicIndex = 0;
          renderMusic();
        }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) nextMusic();
        setPlayPauseButton(e.data === YT.PlayerState.PLAYING);
      }
    }
  };
  if (musicQueue.length > 0) config.videoId = musicQueue[0];
  player = new YT.Player("player", config);
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
